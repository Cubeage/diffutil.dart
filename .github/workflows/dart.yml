name: Build

on:
  merge_group:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: sylphx-linux-standard


    # strategy:
    #  matrix:
    #   sdk: [ dev, beta, stable ]

    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v1

      - name: Install dependencies
        run: dart pub get


      - name: Check format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage to codecov
        run: curl -s https://codecov.io/bash | bash

  # Aggregate gate: the merge queue requires only this check. Skipped jobs pass;
  # a failed or cancelled gating job fails it.
  ci-ok:
    if: always()
    needs: [build]
    runs-on: sylphx-linux-standard
    timeout-minutes: 5
    steps:
      - name: All gating jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gating job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
